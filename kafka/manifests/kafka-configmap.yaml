apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-configmap
  namespace: kafka
data:
  # --- KRaft mode ---
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "10@kafka-0.kafka.kafka.svc.cluster.local:9093"

  # --- Listeners ---
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INSIDE"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

  # --- Log & Retention ---
  KAFKA_LOG_DIRS: "/kafka/data"
  KAFKA_LOG_RETENTION_HOURS: "168"
  KAFKA_LOG_SEGMENT_BYTES: "1073741824"
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"

  # --- Performance ---
  KAFKA_NUM_NETWORK_THREADS: "6"
  KAFKA_NUM_IO_THREADS: "8"
  KAFKA_SOCKET_SEND_BUFFER_BYTES: "102400"
  KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: "102400"
  KAFKA_SOCKET_REQUEST_MAX_BYTES: "104857600"

  # --- Replication ---
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_MIN_INSYNC_REPLICAS: "1"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  # --- Auto topic ---
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"

  # --- JVM heap ---
  KAFKA_HEAP_OPTS: "-Xmx8g -Xms4g"
